<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>통합 관리 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --desk: #f8fafc; --paper: #ffffff; --ink: #25282d; --muted: #80838a; --line: #e3e0d6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --desk: #121417; --paper: #1e2229; --ink: #ecebe5; --muted: #9a9da3; --line: #2e333d;
      }
    }
    html, body { background-color: var(--desk); color: var(--ink); font-family: 'Noto Sans KR', sans-serif; margin: 0; padding: 0; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .schedule-dark-theme { background-color: #0b0f19 !important; color: #f1f5f9 !important; min-height: 100vh; padding-top: max(env(safe-area-inset-top, 0px), 36px) !important; }
    .schedule-dark-theme .sched-sheet { background: #111827 !important; border: 1px solid #1f2937; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); overflow: hidden; }
    .schedule-dark-theme .sched-binding { height: 18px; background: radial-gradient(circle at 50% 52%, #0b0f19 0 4px, transparent 5px) 0 0/36px 18px repeat-x, #111827; border-bottom: 1px solid #1f2937; }
    .schedule-dark-theme .sched-head { background: linear-gradient(135deg, #1e1b4b, #311042); color: #ffffff; display: flex; align-items: flex-end; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid #2d3748; }
    .schedule-dark-theme .sched-ym small { display: block; font-size: 11px; opacity: .7; letter-spacing: .08em; color: #a5b4fc; }
    .schedule-dark-theme .sched-ym b { font: 800 clamp(24px, 6vw, 38px)/1.05 'Nanum Myeongjo', Batang, serif; color: #ffffff; }
    .schedule-dark-theme .sched-nav { display: flex; gap: 6px; align-items: center; }
    .schedule-dark-theme .sched-nav button { font: inherit; font-size: 13px; color: #fff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 8px; min-width: 34px; height: 34px; padding: 0 10px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; }
    .schedule-dark-theme .sched-head { flex-wrap: wrap; gap: 8px; }
    .schedule-dark-theme .sched-nav button { white-space: nowrap; flex-shrink: 0; touch-action: manipulation; }
    .schedule-dark-theme .sched-nav button:hover { background: rgba(255,255,255,.2); }
    .schedule-dark-theme .sched-dow, .schedule-dark-theme .sched-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    .schedule-dark-theme .sched-dow div { text-align: center; padding: 8px 0; font-size: 11px; font-weight: 600; border-bottom: 1px solid #1f2937; color: #9ca3af; }
    .schedule-dark-theme .sched-dow div:first-child { color: #f87171; }
    .schedule-dark-theme .sched-dow div:last-child { color: #60a5fa; }
    .schedule-dark-theme .sched-cell { font: inherit; color: #e5e7eb; text-align: left; background: #111827; border: 0; border-right: 1px solid #1f2937; border-bottom: 1px solid #1f2937; min-height: 72px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; position: relative; transition: background 0.15s; width: 100%; -webkit-tap-highlight-color: transparent; }
    .schedule-dark-theme .sched-cell:nth-child(7n) { border-right: 0; }
    .schedule-dark-theme .sched-cell:hover { background: #1f2937; }
    .schedule-dark-theme .sched-top { display: flex; justify-content: space-between; align-items: center; width: 100%; pointer-events: none; }
    .schedule-dark-theme .sched-n { font-size: 12px; font-weight: 600; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; color: #d1d5db; }
    .schedule-dark-theme .sched-cell.c0 .sched-n, .schedule-dark-theme .sched-cell.hol .sched-n { color: #f87171; }
    .schedule-dark-theme .sched-cell.c6 .sched-n { color: #60a5fa; }
    .schedule-dark-theme .sched-cell.today .sched-n { background: #6366f1; color: #ffffff; }
    .schedule-dark-theme .sched-hn { font-size: 9px; line-height: 1.1; color: #f87171; font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
    .schedule-dark-theme .sched-p { font-size: 10px; line-height: 1.2; color: #9ca3af; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; pointer-events: none; }
    .schedule-dark-theme .sched-cell.has::after { content: ""; position: absolute; bottom: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: #818cf8; }
    .schedule-dark-theme .sched-cell.sel { outline: 2px solid #818cf8; outline-offset: -2px; background: #1e1b4b; }
    .schedule-dark-theme .sched-foot { padding: 12px 16px; border-top: 1px solid #1f2937; background: #0f172a; }
    .schedule-dark-theme .sched-foot h3 { margin: 0 0 6px; font: 800 13px/1.3 'Nanum Myeongjo', Batang, serif; color: #e2e8f0; }
    .schedule-dark-theme .sched-li { display: flex; gap: 12px; align-items: flex-start; width: 100%; font: inherit; font-size: 12px; color: #cbd5e1; background: none; border: 0; border-bottom: 1px dashed #1e293b; padding: 8px 2px; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
    .schedule-dark-theme .sched-li:hover { color: #ffffff; background: rgba(255,255,255,0.02); }
    .schedule-dark-theme .sched-li .d { min-width: 50px; color: #94a3b8; font-weight: 600; }
    .schedule-dark-theme .sched-li .nm { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .schedule-dark-theme .sched-li.h .d { color: #f87171; }
  </style>
</head>
<body class="transition-colors duration-200">

  <!-- 1. 홈 화면 -->
  <div id="homeView" class="min-h-screen flex flex-col items-center justify-center p-6 space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-block bg-indigo-100 dark:bg-indigo-900/50 p-3 rounded-2xl text-indigo-600 dark:text-indigo-400 mb-2 shadow-sm">
        <i class="fa-solid fa-clipboard-user text-4xl"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">근무 및 업무 통합 시스템</h1>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">원하시는 메뉴를 선택해 주세요.</p>
    </div>
    <div class="w-full max-w-sm space-y-4">
      <button type="button" onclick="switchView('work')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-2xl shadow-md transition flex items-center justify-between group">
        <div class="flex items-center space-x-3">
          <div class="bg-white/15 p-3 rounded-xl"><i class="fa-regular fa-clock text-xl"></i></div>
          <div class="text-left">
            <div class="text-lg font-bold">근무 및 연차</div>
            <div class="text-xs text-indigo-200">연장,특근 근무 및 연차 관리</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-indigo-200 group-hover:translate-x-1 transition"></i>
      </button>
      <button type="button" onclick="switchView('schedule')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-4 rounded-2xl shadow-md transition flex items-center justify-between group">
        <div class="flex items-center space-x-3">
          <div class="bg-white/15 p-3 rounded-xl"><i class="fa-regular fa-calendar-days text-xl"></i></div>
          <div class="text-left">
            <div class="text-lg font-bold">업무 일지</div>
            <div class="text-xs text-emerald-100">업무 내용 관리</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right text-emerald-200 group-hover:translate-x-1 transition"></i>
      </button>
    </div>
  </div>

  <!-- 2. 근무 및 연차 화면 -->
  <div id="workView" class="hidden min-h-screen flex flex-col">
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-30 pt-3 sm:pt-0">
      <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 sm:h-18 flex items-center justify-between">
        <div class="flex items-center space-x-2 sm:space-x-3">
          <button type="button" onclick="goHome()" class="bg-white/10 hover:bg-white/20 p-2 rounded-lg text-white mr-1" title="홈으로"><i class="fa-solid fa-house"></i></button>
          <div>
            <h1 class="text-sm sm:text-xl font-bold tracking-tight">근무 및 연차 관리</h1>
          </div>
        </div>
        <div class="flex items-center space-x-2">
          <button type="button" id="openAddModalBtn" class="bg-emerald-500 hover:bg-emerald-400 text-white px-3 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-semibold shadow-sm transition flex items-center space-x-1"><i class="fa-solid fa-plus"></i><span>등록</span></button>
        </div>
      </div>
    </header>
    <main class="max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 py-4 sm:py-6 flex-1 w-full space-y-4">
      <section class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-3 flex flex-col md:flex-row items-center justify-between gap-3">
        <div class="flex items-center space-x-2 w-full md:w-auto justify-between">
          <button type="button" id="prevMonthBtn" class="p-2 text-slate-500 hover:text-indigo-600 rounded-lg"><i class="fa-solid fa-chevron-left"></i></button>
          <input type="month" id="monthPicker" class="text-base font-bold bg-transparent border border-slate-300 dark:border-slate-600 rounded-lg px-2 py-1">
          <button type="button" id="nextMonthBtn" class="p-2 text-slate-500 hover:text-indigo-600 rounded-lg"><i class="fa-solid fa-chevron-right"></i></button>
          <button type="button" id="todayBtn" class="text-xs bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-medium px-2.5 py-1.5 rounded-md border border-slate-200 dark:border-slate-600">이번 달</button>
        </div>
        <div class="flex items-center space-x-2 w-full md:w-auto justify-end">
          <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">근무자:</span>
          <select id="workerFilter" class="bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 text-xs sm:text-sm rounded-lg px-2.5 py-1.5"><option value="ALL">전체 보기</option></select>
        </div>
      </section>
      <section class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-2 sm:p-6 overflow-x-auto">
        <div class="grid grid-cols-7 text-center font-semibold text-xs sm:text-sm text-slate-500 border-b dark:border-slate-700 pb-2 mb-2 min-w-[280px]">
          <div class="text-red-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-blue-500">토</div>
        </div>
        <div id="calendarGrid" class="grid grid-cols-7 gap-1 min-w-[280px]"></div>
      </section>
      <section class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-3 space-y-3">
        <h3 class="text-xs sm:text-sm font-bold flex items-center space-x-2"><i class="fa-solid fa-users text-indigo-600"></i><span>근무자별 월간 집계 내역</span></h3>
        <div id="workerBreakdownContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5"></div>
      </section>
    </main>
  </div>

  <!-- 3. 업무 일지 화면 -->
  <div id="scheduleView" class="hidden min-h-screen flex flex-col p-3 sm:p-6 schedule-dark-theme">
    <div class="max-w-[820px] w-full mx-auto mb-3 flex justify-between items-center bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60 shadow-md">
      <button type="button" onclick="goHome()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-1.5 shadow transition"><i class="fa-solid fa-house"></i><span>홈으로</span></button>
    </div>
    <div class="cal-wrap flex flex-col gap-4 max-w-[820px] w-full mx-auto pb-6">
  <!-- 업무 일지 직접 추가/관리 모달 -->
  <div id="schedModal" style="display: none; width: 100%; box-sizing: border-box;">
    <div style="background: #111827; color: #f1f5f9; width: 100%; border-radius: 16px; border: 2px solid #6366f1; display: flex; flex-direction: column; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.9); overflow: hidden;">
      
      <!-- 상단 타이틀 -->
      <div style="background: #1f2937; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #374151; flex-shrink: 0;">
        <div>
          <h3 id="modalDateTitle" style="margin: 0; font-size: 15px; font-weight: bold; color: #818cf8;">업무 일지 등록</h3>
          <p id="modalLunar" style="margin: 2px 0 0 0; font-size: 11px; color: #9ca3af;">날짜, 설비, 작업 내용 입력</p>
        </div>
        <button type="button" data-sched-close="1" style="background: none; border: none; color: #9ca3af; font-size: 20px; cursor: pointer; padding: 4px;"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- 내부 콘텐츠 (스크롤 가능) -->
      <div style="padding: 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px;">
        
        <!-- 새 설비 작업 추가 폼 -->
        <div style="background: #1f2937; padding: 12px; border-radius: 10px; border: 1px solid #374151; display: flex; flex-direction: column; gap: 10px;">
          <h4 style="margin: 0; font-size: 12px; font-weight: bold; color: #a5b4fc;"><i class="fa-solid fa-pen-to-square" style="margin-right: 4px;"></i> <span id="schedFormTitle">업무 일지 작성</span></h4>
          <div>
            <label style="display: block; font-size: 10px; font-weight: bold; color: #d1d5db; margin-bottom: 3px;">날짜 선택 *</label>
            <input type="date" id="inputSchedDate" style="width: 100%; padding: 8px 10px; background: #0b0f19; border: 1px solid #4b5563; border-radius: 6px; font-size: 13px; color: #fff; box-sizing: border-box;">
          </div>
          <div>
            <label style="display: block; font-size: 10px; font-weight: bold; color: #d1d5db; margin-bottom: 3px;">설비명 *</label>
            <input type="text" id="inputFacility" placeholder=" " style="width: 100%; padding: 8px 10px; background: #0b0f19; border: 1px solid #4b5563; border-radius: 6px; font-size: 13px; color: #fff; box-sizing: border-box;">
          </div>
          <div>
            <label style="display: block; font-size: 10px; font-weight: bold; color: #d1d5db; margin-bottom: 3px;">작업 내용 *</label>
            <textarea id="inputTaskMemo" rows="3" placeholder=" " style="width: 100%; padding: 8px 10px; background: #0b0f19; border: 1px solid #4b5563; border-radius: 6px; font-size: 13px; color: #fff; box-sizing: border-box; resize: none;"></textarea>
          </div>
          <div id="schedMaterialsWrap" style="display: block;">
            <label style="display: block; font-size: 10px; font-weight: bold; color: #fbbf24; margin-bottom: 3px;">필요 자재 및 공구</label>
            <textarea id="inputMaterials" rows="2" placeholder=" " style="width: 100%; padding: 8px 10px; background: #0b0f19; border: 1px solid #b45309; border-radius: 6px; font-size: 13px; color: #fff; box-sizing: border-box; resize: none;"></textarea>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2px;">
            <span id="schedModalMsg" style="font-size: 11px; color: #34d399; font-weight: 500;"></span>
            <button type="button" id="addSchedTaskBtn" style="padding: 8px 16px; background: #4f46e5; color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;"><i class="fa-solid fa-check"></i> <span id="schedSaveLabel">저장하기</span></button>
          </div>
        </div>

        <!-- 해당 월 등록된 전체 작업 목록 확인 및 삭제 -->
        <div>
          <h4 style="margin: 0 0 6px 0; font-size: 11px; font-weight: bold; color: #9ca3af; text-transform: uppercase;"><i class="fa-solid fa-list-check" style="margin-right: 4px; color: #818cf8;"></i> 이달의 등록된 작업 목록</h4>
          <div id="facilityTaskList" style="display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto;">
            <p style="font-size: 12px; color: #6b7280; text-align: center; margin: 6px 0;">등록된 작업이 없습니다.</p>
          </div>
        </div>

      </div>

      <!-- 하단 닫기 버튼 -->
      <div style="background: #1f2937; padding: 12px 16px; border-top: 1px solid #374151; display: flex; justify-content: flex-end; flex-shrink: 0;">
        <button type="button" data-sched-close="1" style="padding: 8px 16px; background: #374151; color: #d1d5db; border: none; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer;">닫기</button>
      </div>

    </div>
  </div>

      <div class="sched-sheet">
        <div class="sched-binding" aria-hidden="true"></div>
        <div class="sched-head">
          <div class="sched-ym"><small id="y"></small><b id="m"></b></div>
          <div class="sched-nav">
            <!-- [추가] 버튼 - onclick 직접 연결로 클릭 신뢰성 100% 확보 -->
            <button type="button" id="openNewSchedModalBtn" data-sched-open="1" style="background: #4f46e5; border-color: #6366f1; font-weight: bold;"><i class="fa-solid fa-plus mr-1"></i> 추가</button>
            <button type="button" id="prev" aria-label="이전 달">◀</button>
            <button type="button" id="today">오늘</button>
            <button type="button" id="next" aria-label="다음 달">▶</button>
          </div>
        </div>
        <div class="sched-dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
        <div class="sched-grid" id="schedGrid"></div>
        <div id="schedDayPanel" style="display: none; padding: 12px 16px; border-top: 1px solid #1f2937; background: #0b1220;"></div>
        <div class="sched-foot"><h3 id="fh"></h3><div id="list"></div><button type="button" data-sched-open="1" style="margin-top:10px;width:100%;padding:12px;background:#4f46e5;color:#fff;border:0;border-radius:10px;font-size:14px;font-weight:bold;"><i class="fa-solid fa-plus"></i> 업무 일지 추가</button></div>
      </div>
    </div>
  </div>

  <!-- 근무 등록/수정 모달 -->
  <div id="entryModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-2xl shadow-xl border dark:border-slate-700 w-full max-w-md overflow-hidden">
      <div class="bg-slate-50 dark:bg-slate-900 px-6 py-4 border-b dark:border-slate-700 flex items-center justify-between">
        <h3 id="modalTitle" class="text-lg font-bold">내역 등록</h3>
        <button type="button" id="closeModalBtn" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="recordForm" class="p-6 space-y-4">
        <input type="hidden" id="recordId">
        <div><label class="block text-xs font-bold mb-1">날짜 *</label><input type="date" id="inputDate" required class="w-full px-3 py-2 border dark:border-slate-600 rounded-lg text-sm bg-transparent"></div>
        <div><label class="block text-xs font-bold mb-1">이름 *</label><input type="text" id="inputWorker" placeholder="예: 홍길동" required class="w-full px-3 py-2 border dark:border-slate-600 rounded-lg text-sm bg-transparent"></div>
        <div>
          <label class="block text-xs font-bold mb-1">구분 *</label>
          <select id="inputCategory" required class="w-full px-3 py-2 border dark:border-slate-600 rounded-lg text-sm bg-transparent">
            <option value="연장근무" class="dark:bg-slate-800">연장근무</option>
            <option value="휴일특근" class="dark:bg-slate-800">휴일특근</option>
            <option value="야간근무" class="dark:bg-slate-800">야간근무</option>
            <option value="연차" class="dark:bg-slate-800">연차 (8h)</option>
            <option value="반차" class="dark:bg-slate-800">반차 (4h)</option>
            <option value="조퇴" class="dark:bg-slate-800">조퇴</option>
          </select>
        </div>
        <div><label class="block text-xs font-bold mb-1">시간 *</label><input type="number" id="inputHours" step="0.5" min="0" max="24" required class="w-full px-3 py-2 border dark:border-slate-600 rounded-lg text-sm bg-transparent"></div>
        <div><label class="block text-xs font-bold mb-1">사유 및 비고</label><textarea id="inputMemo" rows="3" class="w-full px-3 py-2 border dark:border-slate-600 rounded-lg text-sm resize-none bg-transparent">생산-Line 설비 유지 관리</textarea></div>
        <div class="flex items-center justify-between pt-3 border-t dark:border-slate-700">
          <button type="button" id="deleteModalBtn" class="px-4 py-2 text-sm font-medium text-red-600 bg-red-50 dark:bg-red-900/30 rounded-lg hidden">삭제</button>
          <div class="flex space-x-2 ml-auto">
            <button type="button" id="cancelModalBtn" class="px-4 py-2 text-sm text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 rounded-lg">취소</button>

  <!-- 통합 스크립트 -->
  <script>
    window.addEventListener('error', function(ev) {
      var b = document.getElementById('errBanner');
      if (!b) {
        b = document.createElement('div'); b.id = 'errBanner';
        b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:100000;background:#b91c1c;color:#fff;font-size:11px;padding:6px 10px;word-break:break-all;';
        document.body.appendChild(b);
      }
      b.textContent = '오류: ' + (ev.message || '') + ' (줄 ' + (ev.lineno || '?') + ')';
    });
  </script>
  <script>
    function switchView(type) {
      document.getElementById('homeView').classList.add('hidden');
      if (type === 'work') {
        document.getElementById('workView').classList.remove('hidden');
        document.getElementById('scheduleView').classList.add('hidden');
        initWorkApp();
      } else {
        document.getElementById('workView').classList.add('hidden');
        document.getElementById('scheduleView').classList.remove('hidden');
        initScheduleApp();
      }
    }

    function localToday() {
      var n = new Date();
      return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');
    }

    function normDate(dateStr) {
      var p = parseLocalDate(dateStr);
      return p ? (p.y + '-' + String(p.m).padStart(2, '0') + '-' + String(p.d).padStart(2, '0')) : String(dateStr || '');
    }

    function fmtKorDate(dateStr) {
      var p = parseLocalDate(dateStr);
      if (!p) return String(dateStr || '');
      var dow = ['일','월','화','수','목','금','토'][new Date(p.y, p.m - 1, p.d).getDay()];
      return p.y + '년 ' + String(p.m).padStart(2, '0') + '월 ' + String(p.d).padStart(2, '0') + '일(' + dow + ')';
    }

    function goHome() {
      document.getElementById('homeView').classList.remove('hidden');
      document.getElementById('workView').classList.add('hidden');
      document.getElementById('scheduleView').classList.add('hidden');
    }

    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbypVfJMF2TOIpVT9QOCEcno_TKSgQYJOsMJirvmV1VjDsih7whixYDug9fW-GfZ8_kkVg/exec';
    let records = [];
    let curY = new Date().getFullYear(), curM = new Date().getMonth() + 1;
    let workInitialized = false;
    const openWorkers = new Set();

    document.addEventListener('click', function(e) {
      var t = e.target;
      if (!t || !t.closest) return;
      var ed = t.closest('[data-rec-edit]');
      if (ed) { e.preventDefault(); openEditModal(ed.getAttribute('data-rec-edit')); return; }
      var dl = t.closest('[data-rec-del]');
      if (dl) {
        e.preventDefault();
        var id = dl.getAttribute('data-rec-del');
        if (dl.getAttribute('data-armed') === '1') {
          records = records.filter(function(r){ return String(r.id) !== String(id); });
          sendDataToSheet({ action: 'delete', id: id });
          renderWork();
        } else {
          dl.setAttribute('data-armed', '1');
          dl.textContent = '한 번 더';
          dl.style.background = '#b91c1c'; dl.style.color = '#fff';
          setTimeout(function(){ renderWork(); }, 3000);
        }
      }
    });

    async function initWorkApp() {
      if (!workInitialized) {
        setMonthPickerValue(curY, curM);
        setupWorkEventListeners();
        workInitialized = true;
      }
      await fetchRecordsFromSheet();
    }

    function setMonthPickerValue(y, m) {
      document.getElementById('monthPicker').value = `${y}-${String(m).padStart(2, '0')}`;
    }

    async function fetchRecordsFromSheet() {
      try {
        const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
        records = await res.json();
        renderWork();
      } catch (e) { console.error(e); }
    }

    async function sendDataToSheet(payload) {
      try {
        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
      } catch (e) { console.error(e); }
    }

    function parseLocalDate(dateStr) {
      if (!dateStr) return null;
      var s = String(dateStr).trim();
      var mm = s.match(/^[A-Za-z]{3}\s+([A-Za-z]{3})\s+(\d{1,2})\s+(\d{4})/);
      if (mm) {
        var mi = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(mm[1]);
        if (mi >= 0) return { y: parseInt(mm[3], 10), m: mi + 1, d: parseInt(mm[2], 10) };
      }
      if (s.includes('T') || s.includes('Z')) {
        var d = new Date(s);
        if (!isNaN(d.getTime())) {
          return { y: d.getFullYear(), m: d.getMonth() + 1, d: d.getDate() };
        }
      }
      var parts = s.split('T')[0].split('-');
      if (parts.length >= 3) {
        return { y: parseInt(parts[0], 10), m: parseInt(parts[1], 10), d: parseInt(parts[2], 10) };
      }
      return null;
    }

    function renderWork() {
      const [y, m] = document.getElementById('monthPicker').value.split('-').map(Number);
      curY = y; curM = m;
      const monthly = records.filter(r => {
        var p = parseLocalDate(r.date);
        return p && p.y === y && p.m === m;
      });

      const filterEl = document.getElementById('workerFilter');
      const curSel = filterEl.value;
      const workers = [...new Set(records.map(r => r.workerName))].filter(Boolean).sort();
      filterEl.innerHTML = `<option value="ALL">전체 보기</option>`;
      workers.forEach(w => {
        const opt = document.createElement('option');
        opt.value = w; opt.textContent = w;
        if (w === curSel) opt.selected = true;
        filterEl.appendChild(opt);
      });

      const filtered = filterEl.value === 'ALL' ? monthly : monthly.filter(r => r.workerName === filterEl.value);
      renderWorkerBreakdown(monthly);
      renderCalendar(y, m, filtered);
    }

    function renderWorkerBreakdown(monthly) {
      const container = document.getElementById('workerBreakdownContainer');
      container.innerHTML = '';
      const map = {};
      monthly.forEach(r => {
        const name = r.workerName || '미지정';
        if (!map[name]) map[name] = { totalHours: 0, overtime: 0, holiday: 0, night: 0, leave: 0, recs: [] };
        map[name].recs.push(r);
        const hrs = parseFloat(r.hours) || 0;
        if (['연장근무', '휴일특근', '야간근무'].includes(r.category)) map[name].totalHours += hrs;
        if (r.category === '연장근무') map[name].overtime += hrs;
        if (r.category === '휴일특근') map[name].holiday += hrs;
        if (r.category === '야간근무') map[name].night += hrs;
        if (['연차', '반차', '조퇴'].includes(r.category)) map[name].leave += 1;
      });

      const names = Object.keys(map).sort();
      if (names.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 col-span-full py-2">등록된 내역이 없습니다.</p>`;
        return;
      }
      names.forEach(name => {
        const d = map[name];
        const card = document.createElement('div');
        card.className = 'bg-slate-50 dark:bg-slate-700/50 border dark:border-slate-700 rounded-lg p-2.5';
        card.innerHTML = `
          <div class="flex justify-between mb-1 text-xs font-bold"><span>${name}</span><span class="text-indigo-600 dark:text-indigo-400">총 ${d.totalHours}시간</span></div>
          <div class="grid grid-cols-4 text-center text-[10px] bg-white dark:bg-slate-800 p-1 rounded border dark:border-slate-700 text-slate-600 dark:text-slate-300">
            <div>연장<br><b>${d.overtime}h</b></div><div>특근<br><b>${d.holiday}h</b></div><div>야간<br><b>${d.night}h</b></div><div>휴가<br><b>${d.leave}회</b></div>
          </div>`;
        // 내역 목록 (수정/삭제 버튼)
        const det = document.createElement('details');
        det.className = 'mt-2';
        det.open = openWorkers.has(name);
        det.addEventListener('toggle', () => { if (det.open) openWorkers.add(name); else openWorkers.delete(name); });
        const sum = document.createElement('summary');
        sum.className = 'text-[11px] font-semibold text-indigo-600 dark:text-indigo-400 cursor-pointer py-1';
        sum.textContent = `내역 보기·수정·삭제 (${d.recs.length}건)`;
        det.appendChild(sum);
        d.recs.slice().sort((a, b) => {
          const pa = parseLocalDate(a.date) || {d: 0}, pb = parseLocalDate(b.date) || {d: 0};
          return pa.d - pb.d;
        }).forEach(r => {
          const p = parseLocalDate(r.date);
          const row = document.createElement('div');
          row.className = 'flex items-center justify-between gap-2 py-1.5 border-t dark:border-slate-700 text-[11px]';
          row.innerHTML = `
            <div class="min-w-0 flex-1">
              <div class="font-semibold">${p ? p.m + '/' + p.d : ''} ${r.category} ${r.hours}h</div>
              ${r.memo ? `<div class="text-slate-500 dark:text-slate-400 truncate">${r.memo}</div>` : ''}
            </div>
            <button type="button" data-rec-edit="${r.id}" class="px-3 py-2 text-xs font-semibold rounded-lg bg-indigo-50 text-indigo-700 dark:bg-indigo-900/40 dark:text-indigo-300 shrink-0">수정</button>
            <button type="button" data-rec-del="${r.id}" class="px-3 py-2 text-xs font-semibold rounded-lg bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-300 shrink-0">삭제</button>`;
          det.appendChild(row);
        });
        card.appendChild(det);
        container.appendChild(card);
      });
    }

    function renderCalendar(y, m, monthly) {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      const first = new Date(y, m - 1, 1).getDay();
      const last = new Date(y, m, 0).getDate();
      const byDay = {};
      monthly.forEach(r => {
        var p = parseLocalDate(r.date);
        if (p) {
          if (!byDay[p.d]) byDay[p.d] = [];
          byDay[p.d].push(r);
        }
      });

      for (let i = 0; i < first; i++) grid.appendChild(document.createElement('div'));

      const today = new Date();
      const isCur = today.getFullYear() === y && (today.getMonth() + 1) === m;

      for (let d = 1; d <= last; d++) {
        const cell = document.createElement('div');
        const isT = isCur && today.getDate() === d;
        cell.className = `min-h-[75px] rounded-lg p-1 border flex flex-col justify-between ${isT ? 'bg-indigo-50/30 dark:bg-indigo-950/30 border-indigo-300 dark:border-indigo-700 ring-1 ring-indigo-200' : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700'}`;
        
        const dStr = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        cell.innerHTML = `
          <div class="flex justify-between items-center mb-0.5">
            <span class="text-xs font-bold ${isT ? 'bg-indigo-600 text-white px-1.5 rounded-full' : ''}">${d}</span>
            <button type="button" onclick="openAddModal('${dStr}')" class="text-slate-300 hover:text-indigo-600 text-xs"><i class="fa-solid fa-plus"></i></button>
          </div>
          <div class="space-y-0.5 overflow-y-auto max-h-[60px] no-scrollbar"></div>`;
        
        const content = cell.querySelector('div:last-child');
        (byDay[d] || []).forEach(r => {
          const badge = document.createElement('div');
          badge.onclick = (e) => { e.stopPropagation(); openEditModal(r.id); };
          badge.className = 'text-[9px] px-1 py-0.5 rounded border truncate cursor-pointer bg-slate-50 dark:bg-slate-700 dark:border-slate-600 flex justify-between';
          badge.innerHTML = `<span><b>${r.workerName}</b> (${r.category})</span><b>${r.hours}h</b>`;
          content.appendChild(badge);
        });
        grid.appendChild(cell);
      }
    }

    function setupWorkEventListeners() {
      document.getElementById('monthPicker').onchange = renderWork;
      document.getElementById('workerFilter').onchange = renderWork;
      document.getElementById('prevMonthBtn').onclick = () => { curM--; if(curM<1){curM=12;curY--;} setMonthPickerValue(curY,curM); renderWork(); };
      document.getElementById('nextMonthBtn').onclick = () => { curM++; if(curM>12){curM=1;curY++;} setMonthPickerValue(curY,curM); renderWork(); };
      document.getElementById('todayBtn').onclick = () => { const now=new Date(); curY=now.getFullYear(); curM=now.getMonth()+1; setMonthPickerValue(curY,curM); renderWork(); };
      
      document.getElementById('openAddModalBtn').onclick = () => { document.getElementById('recordForm').reset(); document.getElementById('recordId').value=''; document.getElementById('inputDate').value = localToday(); document.getElementById('inputHours').value='2.5'; document.getElementById('inputMemo').value = '생산-Line 설비 유지 관리'; document.getElementById('modalTitle').textContent = '내역 등록'; document.getElementById('entryModal').classList.remove('hidden'); document.getElementById('deleteModalBtn').classList.add('hidden'); };
      document.getElementById('closeModalBtn').onclick = document.getElementById('cancelModalBtn').onclick = () => document.getElementById('entryModal').classList.add('hidden');
      
      document.getElementById('inputCategory').onchange = (e) => {
        if(e.target.value==='연차') document.getElementById('inputHours').value='8';
        else if(e.target.value==='반차') document.getElementById('inputHours').value='4';
        else if(e.target.value==='조퇴') document.getElementById('inputHours').value='2';
      };

      document.getElementById('deleteModalBtn').onclick = async () => {
        const id = document.getElementById('recordId').value;
        const dbtn = document.getElementById('deleteModalBtn');
        if (dbtn.dataset.armed !== '1') {
          dbtn.dataset.armed = '1'; dbtn.textContent = '한 번 더 누르면 삭제';
          setTimeout(function(){ dbtn.dataset.armed = ''; dbtn.textContent = '삭제'; }, 3000);
          return;
        }
        dbtn.dataset.armed = ''; dbtn.textContent = '삭제';
        {
          records = records.filter(r => r.id.toString() !== id.toString());
          await sendDataToSheet({ action: 'delete', id });
          document.getElementById('entryModal').classList.add('hidden');
          renderWork();
        }
      };

      document.getElementById('recordForm').onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('recordId').value;
        const date = document.getElementById('inputDate').value;
        const workerName = document.getElementById('inputWorker').value.trim();
        const category = document.getElementById('inputCategory').value;
        const hours = parseFloat(document.getElementById('inputHours').value);
        const memo = document.getElementById('inputMemo').value.trim();

        if(id) {
          const idx = records.findIndex(r => r.id.toString() === id.toString());
          if(idx !== -1) records[idx] = { id, date, workerName, category, hours, memo };
          await sendDataToSheet({ action: 'update', id, date, workerName, category, hours, memo });
        } else {
          const newRec = { id: Date.now().toString(), date, workerName, category, hours, memo };
          records.push(newRec);
          await sendDataToSheet({ action: 'insert', ...newRec });
        }
        document.getElementById('entryModal').classList.add('hidden');
        renderWork();
      };

    }

    function openAddModal(dateStr) {
      document.getElementById('recordForm').reset();
      document.getElementById('recordId').value = '';
      document.getElementById('inputDate').value = dateStr;
      document.getElementById('modalTitle').textContent = '내역 등록';
      document.getElementById('inputHours').value = '2.5';
      document.getElementById('inputMemo').value = '생산-Line 설비 유지 관리';
      document.getElementById('entryModal').classList.remove('hidden');
      document.getElementById('deleteModalBtn').classList.add('hidden');
    }

    function openEditModal(id) {
      const r = records.find(item => item.id.toString() === id.toString());
      if(!r) return;
      document.getElementById('recordId').value = r.id;
      var pd = parseLocalDate(r.date);
      document.getElementById('inputDate').value = pd ? `${pd.y}-${String(pd.m).padStart(2,'0')}-${String(pd.d).padStart(2,'0')}` : '';
      document.getElementById('modalTitle').textContent = '내역 수정';
      document.getElementById('inputWorker').value = r.workerName;
      document.getElementById('inputCategory').value = r.category;
      document.getElementById('inputHours').value = r.hours;
      document.getElementById('inputMemo').value = r.memo || '';
      document.getElementById('entryModal').classList.remove('hidden');
      document.getElementById('deleteModalBtn').classList.remove('hidden');
    }

    // --- 2. 업무 일지 로직 ---
    let schedInitialized = false;
    let scheduleList = [];

    async function initScheduleApp() {
      if (!schedInitialized) {
        setupScheduleEventListeners();
        schedInitialized = true;
      }
      await fetchScheduleFromSheet();
    }

    async function fetchScheduleFromSheet() {
      try {
        const res = await fetch(SCRIPT_URL + '?type=schedule&t=' + Date.now());
        var data = await res.json();
        if (Array.isArray(data)) {
          scheduleList = data.filter(function(it){ return it && it.facility !== undefined; });
          // 새 스크립트는 항목마다 materials 칸을 함께 보내 줌 (옛 스크립트는 없음)
          if (scheduleList.length > 0) schedBackendHasMaterials = ('materials' in scheduleList[0]);
        }
      } catch (e) {
        console.error(e);
      }
      renderSchedGrid();
    }

    async function saveScheduleRowToSheet(payload) {
      try {
        await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
      } catch (e) { console.error(e); }
    }

    function getHolidaysOfYear(year) {
      var hMap = {};
      var fixed = {'01-01': '신정', '03-01': '삼일절', '05-05': '어린이날', '06-06': '현충일', '08-15': '광복절', '10-03': '개천절', '10-09': '한글날', '12-25': '성탄절'};
      for (var md in fixed) hMap[year + '-' + md] = fixed[md];
      return hMap;
    }

    var dNow = new Date();
    var todayKey = dNow.getFullYear() + '-' + String(dNow.getMonth() + 1).padStart(2, '0') + '-' + String(dNow.getDate()).padStart(2, '0');
    var vy = dNow.getFullYear(), vm = dNow.getMonth();

    function renderSchedGrid(){
      var yEl = document.getElementById('y'), mEl = document.getElementById('m');
      if (yEl) yEl.textContent = vy+'년';
      if (mEl) mEl.textContent = (vm+1)+'월';

      var grid = document.getElementById('schedGrid');
      if (!grid) return;
      grid.innerHTML = '';
      
      var first = new Date(vy, vm, 1).getDay();
      var days = new Date(vy, vm + 1, 0).getDate();
      var total = Math.ceil((first+days)/7)*7;
      var holidayMap = getHolidaysOfYear(vy);
      
      var dateMap = {};
      scheduleList.forEach(item => {
        var p = parseLocalDate(item.date);
        if (p) {
          var k = `${p.y}-${String(p.m).padStart(2, '0')}-${String(p.d).padStart(2, '0')}`;
          if (!dateMap[k]) dateMap[k] = [];
          dateMap[k].push(item);
        }
      });

      for(var i=0; i<total; i++){
        var d = i - first + 1;
        if(d < 1 || d > days){ 
          var emptyDiv = document.createElement('div');
          grid.appendChild(emptyDiv);
          continue; 
        }
        
        var k = vy + '-' + String(vm + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        var dayItems = dateMap[k] || [];
        var displayTxt = dayItems.map(item => `[${item.facility}] ${item.memo}`).join(', ');

        var holName = holidayMap[k] || '';
        var isHol = ((i % 7 === 0) || holName !== '');

        var b = document.createElement('div');
        b.className = `sched-cell c${i%7} ${isHol?'hol':''} ${k===todayKey?'today':''} ${dayItems.length>0?'has':''} ${k===selectedSchedDate?'sel':''}`;
        b.setAttribute('data-date', k);
        b.innerHTML = `<div class="sched-top"><span class="sched-n">${d}</span>${holName?`<span class="sched-hn">${holName}</span>`:''}</div>${displayTxt?`<span class="sched-p">${displayTxt}</span>`:''}`;
        
        grid.appendChild(b);
      }
      renderSchedList(days, holidayMap, dateMap);
      renderSchedDayPanel();
    }

    function renderSchedList(days, holidayMap, dateMap){
      var L = document.getElementById('list'); 
      if (!L) return;
      L.innerHTML = '';
      var fh = document.getElementById('fh');
      if (fh) fh.textContent = (vm+1)+'월 주요 업무 및 일정';
      
      var any = false;
      for(var d=1; d<=days; d++){
        var k = vy + '-' + String(vm + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        var holName = holidayMap[k] || '';
        var dayItems = dateMap[k] || [];

        if(dayItems.length > 0 || holName){
          any = true;
          var divLi = document.createElement('div'); 
          divLi.className = `sched-li ${holName?'h':''}`;
          
          var nmHtml = '';
          if (holName) {
            nmHtml += `<div style="color: #f87171; font-weight: 600;">[${holName}]</div>`;
          }
          dayItems.forEach(item => {
            nmHtml += `<div><b>${item.facility}</b> ${item.memo}</div>`;
            if (item.materials) nmHtml += `<div style="color:#fbbf24; font-size:11px;">필요 자재 및 공구: ${item.materials}</div>`;
          });

          divLi.innerHTML = `<span class="d">${d}일</span><span class="nm">${nmHtml}</span>`;
          L.appendChild(divLi);
        }
      }
      if(!any) L.innerHTML = `<p class="text-xs text-slate-500 py-1">작성된 업무 일지가 없습니다.</p>`;
    }

    // 업무일지 등록 모달 열기
    function openNewSchedModal() {
      var modal = document.getElementById('schedModal');
      if (!modal) return;

      var todayStr = localToday();
      var pYearMonth = vy + '-' + String(vm + 1).padStart(2, '0');
      if (todayStr.indexOf(pYearMonth) !== 0) todayStr = pYearMonth + '-01';

      document.getElementById('inputSchedDate').value = todayStr;
      document.getElementById('inputFacility').value = '';
      document.getElementById('inputTaskMemo').value = '';
      document.getElementById('inputMaterials').value = '';
      resetSchedEditState();
      updateMaterialsVisibility();
      document.getElementById('schedModalMsg').textContent = '';

      modal.style.display = 'block';         // 화면 안에서 펼침
      try { modal.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
      try { renderModalTaskList(); } catch (e) { console.error(e); }  // 목록 오류가 나도 모달은 열림
    }

    function updateMaterialsVisibility() {
      var dv = document.getElementById('inputSchedDate').value;
      var wrap = document.getElementById('schedMaterialsWrap');
      if (!wrap) return;
      wrap.style.display = 'block';   // 날짜와 상관없이 항상 표시
    }
    document.addEventListener('change', function(e) { if (e.target && e.target.id === 'inputSchedDate') updateMaterialsVisibility(); });
    document.addEventListener('input',  function(e) { if (e.target && e.target.id === 'inputSchedDate') updateMaterialsVisibility(); });

    var selectedSchedDate = null;

    function renderSchedDayPanel() {
      var panel = document.getElementById('schedDayPanel');
      if (!panel) return;
      var ym = vy + '-' + String(vm + 1).padStart(2, '0');
      if (!selectedSchedDate || selectedSchedDate.indexOf(ym) !== 0) {   // 다른 달로 넘어가면 닫기
        selectedSchedDate = null;
        panel.style.display = 'none';
        panel.innerHTML = '';
        return;
      }
      var items = scheduleList.filter(function(t){ return normDate(t.date) === selectedSchedDate; });
      var html = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">'
        + '<h3 style="margin:0; font-size:13px; font-weight:800; color:#e2e8f0;">' + fmtKorDate(selectedSchedDate) + ' 업무 기록</h3>'
        + '<button type="button" data-day-close="1" style="background:none; border:none; color:#9ca3af; font-size:18px; padding:2px 8px; cursor:pointer;">&times;</button></div>';
      if (items.length === 0) {
        html += '<p style="margin:0 0 8px; font-size:12px; color:#6b7280;">이 날짜에 등록된 업무 기록이 없습니다.</p>';
      }
      items.forEach(function(task) {
        html += '<div style="background:#1f2937; border:1px solid #374151; border-radius:8px; padding:8px 10px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">'
          + '<div style="overflow:hidden; min-width:0;">'
          + '<span style="display:inline-block; background:#311042; color:#a5b4fc; font-size:11px; font-weight:bold; padding:2px 6px; border-radius:4px; border:1px solid #4c1d95; margin-bottom:3px;">' + task.facility + '</span>'
          + '<p style="margin:0; font-size:12px; color:#e5e7eb; word-break:break-all; white-space:pre-wrap;">' + task.memo + '</p>'
          + (task.materials ? '<p style="margin:4px 0 0; font-size:11px; color:#fbbf24; word-break:break-all; white-space:pre-wrap;">필요 자재 및 공구: ' + task.materials + '</p>' : '')
          + '</div>'
          + '<div style="display:flex; gap:6px; flex-shrink:0;">'
          + '<button type="button" data-day-edit="' + task.id + '" style="background:#312e81; border:1px solid #4f46e5; border-radius:6px; color:#c7d2fe; cursor:pointer; padding:8px 10px; min-width:40px; min-height:36px; font-size:12px; font-weight:bold;">수정</button>'
          + '<button type="button" data-day-del="' + task.id + '" style="background:none; border:1px solid #374151; border-radius:6px; color:#9ca3af; cursor:pointer; padding:8px 10px; min-width:40px; min-height:36px; font-size:12px; font-weight:bold;">삭제</button>'
          + '</div></div>';
      });
      html += '<button type="button" data-day-add="1" style="width:100%; padding:10px; background:#4f46e5; color:#fff; border:0; border-radius:8px; font-size:13px; font-weight:bold; cursor:pointer;">+ 이 날짜에 업무 일지 추가</button>';
      panel.innerHTML = html;
      panel.style.display = 'block';
    }

    function selectSchedDate(dateStr) {
      selectedSchedDate = dateStr;
      renderSchedGrid();   // 선택 표시 + 패널 갱신
      var panel = document.getElementById('schedDayPanel');
      try { panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
    }

    function openSchedFormForDate(dateStr) {
      openNewSchedModal();
      document.getElementById('inputSchedDate').value = dateStr;
      updateMaterialsVisibility();
    }

    function closeSchedModal() {
      var modal = document.getElementById('schedModal');
      if (modal) modal.style.display = 'none';
      resetSchedEditState();
    }

    var schedBackendHasMaterials = null;   // null=아직 모름, true/false=스크립트 새 버전 여부
    var editingSchedId = null;
    var editingSchedOrig = null;

    function resetSchedEditState() {
      editingSchedId = null; editingSchedOrig = null;
      var t = document.getElementById('schedFormTitle'); if (t) t.textContent = '업무 일지 작성';
      var l = document.getElementById('schedSaveLabel'); if (l) l.textContent = '저장하기';
    }

    function startEditSchedTask(id) {
      var item = scheduleList.find(function(t){ return String(t.id) === String(id); });
      var msg = document.getElementById('schedModalMsg');
      if (!item) return;
      if (String(id).indexOf('tmp-') === 0) {
        msg.style.color = '#fbbf24'; msg.textContent = '저장 중인 항목이에요. 잠시 후 다시 눌러 주세요.';
        return;
      }
      var pd = parseLocalDate(item.date);
      document.getElementById('inputSchedDate').value = pd ? (pd.y + '-' + String(pd.m).padStart(2,'0') + '-' + String(pd.d).padStart(2,'0')) : '';
      document.getElementById('inputFacility').value = item.facility || '';
      document.getElementById('inputTaskMemo').value = item.memo || '';
      document.getElementById('inputMaterials').value = item.materials || '';
      editingSchedId = id;
      editingSchedOrig = { date: normDate(item.date), facility: item.facility, memo: item.memo };
      document.getElementById('schedFormTitle').textContent = '업무 일지 수정';
      document.getElementById('schedSaveLabel').textContent = '수정 저장';
      msg.style.color = '#fbbf24'; msg.textContent = '내용을 고치고 "수정 저장"을 누르세요.';
      var modal = document.getElementById('schedModal');
      try { modal.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
    }

    var schedSaving = false;
    async function submitSchedTask() {
      if (schedSaving) return;
      var dateVal = document.getElementById('inputSchedDate').value;
      var fac = document.getElementById('inputFacility').value.trim();
      var tsk = document.getElementById('inputTaskMemo').value.trim();
      updateMaterialsVisibility();
      var mat = document.getElementById('inputMaterials').value.trim();
      var msg = document.getElementById('schedModalMsg');
      var btn = document.getElementById('addSchedTaskBtn');

      if (!dateVal || !fac || !tsk) {
        msg.style.color = '#f87171';
        msg.textContent = '날짜, 설비명, 작업 내용을 모두 입력해 주세요.';
        return;
      }

      schedSaving = true;
      if (btn) btn.disabled = true;
      msg.style.color = '#fbbf24';
      msg.textContent = '저장 중...';

      var wasEditing = (editingSchedId !== null);
      if (wasEditing) {
        // 수정: 화면에 먼저 반영 후 시트에 전송
        var eid = editingSchedId, orig = editingSchedOrig;
        scheduleList = scheduleList.map(function(t){
          return String(t.id) === String(eid) ? { id: t.id, date: dateVal, facility: fac, memo: tsk, materials: mat } : t;
        });
        renderSchedGrid();
        try { renderModalTaskList(); } catch (e) {}
        await saveScheduleRowToSheet({ action: 'schedule', subAction: 'update', id: eid, old: orig, date: dateVal, facility: fac, memo: tsk, materials: mat });
        resetSchedEditState();
      } else {
        // 화면에 먼저 표시 (시트 반영 전 임시 항목)
        scheduleList.push({ id: 'tmp-' + Date.now(), date: dateVal, facility: fac, memo: tsk, materials: mat });
        renderSchedGrid();
        try { renderModalTaskList(); } catch (e) {}
        await saveScheduleRowToSheet({ action: 'schedule', subAction: 'insert', date: dateVal, facility: fac, memo: tsk, materials: mat });
      }

      document.getElementById('inputFacility').value = '';
      document.getElementById('inputTaskMemo').value = '';
      document.getElementById('inputMaterials').value = '';

      await fetchScheduleFromSheet();   // 시트 기준으로 다시 동기화
      try { renderModalTaskList(); } catch (e) {}

      if (mat !== '' && schedBackendHasMaterials === false) {
        msg.style.color = '#f87171';
        msg.textContent = '저장은 됐지만 필요 자재 및 공구는 시트에 저장되지 않았어요. 앱스스크립트를 "새 버전"으로 배포해 주세요.';
      } else {
        msg.style.color = '#34d399';
        msg.textContent = wasEditing ? '수정 완료!' : '저장 완료!';
      }
      schedSaving = false;
      if (btn) btn.disabled = false;
    }

    function renderModalTaskList() {
      var container = document.getElementById('facilityTaskList');
      if (!container) return;
      container.innerHTML = '';

      var currentMonthTasks = scheduleList.filter(i => {
        var sp = parseLocalDate(i.date);
        return sp && sp.y === vy && sp.m === (vm + 1);
      });

      if (currentMonthTasks.length === 0) {
        container.innerHTML = `<p style="font-size: 12px; color: #6b7280; text-align: center; margin: 6px 0;">이달에 등록된 작업이 없습니다.</p>`;
        return;
      }

      currentMonthTasks.forEach(task => {
        var div = document.createElement('div');
        div.style.cssText = 'background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 8px 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;';
        div.innerHTML = `
          <div style="overflow: hidden;">
            <div style="font-size: 11px; color: #94a3b8; margin-bottom: 2px;">${fmtKorDate(task.date)}</div>
            <span style="display: inline-block; background: #311042; color: #a5b4fc; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 4px; border: 1px solid #4c1d95; margin-bottom: 3px;">${task.facility}</span>
            <p style="margin: 0; font-size: 12px; color: #e5e7eb; word-break: break-all; white-space: pre-wrap;">${task.memo}</p>
            ${task.materials ? `<p style="margin: 4px 0 0; font-size: 11px; color: #fbbf24; word-break: break-all; white-space: pre-wrap;">필요 자재 및 공구: ${task.materials}</p>` : ''}
          </div>
          <div style="display: flex; gap: 6px; flex-shrink: 0; align-items: flex-start;">
            <button type="button" data-sched-edit="${task.id}" style="background: #312e81; border: 1px solid #4f46e5; border-radius: 6px; color: #c7d2fe; cursor: pointer; padding: 8px 10px; min-width: 40px; min-height: 36px; font-size: 12px; font-weight: bold;" title="수정">수정</button>
            <button type="button" data-del-id="${task.id}" style="background: none; border: 1px solid transparent; border-radius: 6px; color: #9ca3af; cursor: pointer; padding: 8px 10px; min-width: 40px; min-height: 36px; flex-shrink: 0;" title="삭제"><i class="fa-solid fa-trash-can" style="font-size: 14px; pointer-events: none;"></i></button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    async function deleteSchedTask(id) {
      if (editingSchedId !== null && String(editingSchedId) === String(id)) {
        resetSchedEditState();
        document.getElementById('inputFacility').value = ''; document.getElementById('inputTaskMemo').value = ''; document.getElementById('inputMaterials').value = '';
      }
      var item = scheduleList.find(function(t){ return String(t.id) === String(id); });
      var msg = document.getElementById('schedModalMsg');
      msg.style.color = '#fbbf24';
      msg.textContent = '삭제 중...';

      // 화면에서 먼저 제거
      scheduleList = scheduleList.filter(function(t){ return String(t.id) !== String(id); });
      renderSchedGrid();
      try { renderModalTaskList(); } catch (e) {}

      if (item && String(id).indexOf('tmp-') !== 0) {
        await saveScheduleRowToSheet({ action: 'schedule', subAction: 'delete', id: id, date: normDate(item.date), facility: item.facility, memo: item.memo });
      }
      await fetchScheduleFromSheet();
      try { renderModalTaskList(); } catch (e) {}
      msg.style.color = '#34d399';
      msg.textContent = '삭제 완료!';
    }

    // 업무일지 버튼 클릭 처리 (document 위임: 화면이 다시 그려져도 항상 동작)
    document.addEventListener('click', function(e) {
      var t = e.target;
      if (!t || !t.closest) return;
      if (t.closest('[data-sched-open]')) { e.preventDefault(); openNewSchedModal(); return; }
      var cell = t.closest('.sched-cell[data-date]');
      if (cell) { e.preventDefault(); selectSchedDate(cell.getAttribute('data-date')); return; }
      if (t.closest('[data-day-close]')) { e.preventDefault(); selectedSchedDate = null; renderSchedGrid(); return; }
      if (t.closest('[data-day-add]')) { e.preventDefault(); openSchedFormForDate(selectedSchedDate); return; }
      var de = t.closest('[data-day-edit]');
      if (de) {
        e.preventDefault();
        var eid2 = de.getAttribute('data-day-edit');
        var eit = scheduleList.find(function(x){ return String(x.id) === String(eid2); });
        if (eit) {
          var keepDate = selectedSchedDate;
          openNewSchedModal();          // 입력칸을 열고
          startEditSchedTask(eid2);     // 그 작업 내용으로 채움
        }
        return;
      }
      var dd = t.closest('[data-day-del]');
      if (dd) {
        e.preventDefault();
        var did = dd.getAttribute('data-day-del');
        if (dd.getAttribute('data-armed') === '1') {
          deleteSchedTask(did);
        } else {
          dd.setAttribute('data-armed', '1');
          dd.style.cssText += ';background:#b91c1c;color:#fff;border-color:#ef4444;';
          dd.textContent = '한 번 더';
          setTimeout(function(){ try { renderSchedDayPanel(); } catch (er) {} }, 3000);
        }
        return;
      }
      var se = t.closest('[data-sched-edit]');
      if (se) { e.preventDefault(); startEditSchedTask(se.getAttribute('data-sched-edit')); return; }
      var del = t.closest('[data-del-id]');
      if (del) {
        e.preventDefault();
        if (del.getAttribute('data-armed') === '1') {
          deleteSchedTask(del.getAttribute('data-del-id'));
        } else {
          del.setAttribute('data-armed', '1');
          del.style.cssText += ';background:#b91c1c;color:#fff;border-color:#ef4444;';
          del.innerHTML = '<span style="font-size:12px;font-weight:bold;pointer-events:none;">삭제?</span>';
          var m = document.getElementById('schedModalMsg');
          if (m) { m.style.color = '#fbbf24'; m.textContent = '삭제하려면 빨간 버튼을 한 번 더 누르세요'; }
          setTimeout(function(){ try { renderModalTaskList(); } catch (er) {} }, 3000);
        }
        return;
      }
      if (t.closest('[data-sched-close]')) { e.preventDefault(); closeSchedModal(); return; }
      if (t.closest('#addSchedTaskBtn')) { e.preventDefault(); submitSchedTask(); return; }
    });

    function setupScheduleEventListeners() {
      var prevBtn = document.getElementById('prev');
      var nextBtn = document.getElementById('next');
      var todayBtn = document.getElementById('today');

      if (prevBtn) prevBtn.onclick = () => { vm--; if(vm<0){vm=11;vy--;} renderSchedGrid(); };
      if (nextBtn) nextBtn.onclick = () => { vm++; if(vm>11){vm=0;vy++;} renderSchedGrid(); };
      if (todayBtn) todayBtn.onclick = () => { 
        var a = todayKey.split('-'); 
        vy = +a[0]; vm = +a[1]-1; 
        renderSchedGrid(); 
      };
    }
  </script>
</body>
</html>
